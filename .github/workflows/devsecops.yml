
name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devsecops:
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build and run unit tests
      - name: Maven Build and Test
        run: mvn -B clean verify

      # 4. SonarCloud quality gate
      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=wathilawijesinghe \
            -Dsonar.projectKey=wathilawijesinghe_student-api \
            -Dsonar.qualitygate.wait=true

      # 5. Build Docker image with Git SHA
      - name: Build Docker Image
        run: docker build -t student-api:${{ github.sha }} .

      # 6. Trivy vulnerability scan
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: student-api:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'

      # 7. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # 8. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783
      # 9. Push validated Docker image
      - name: Push Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag student-api:${{ github.sha }} \
            $REGISTRY/student-api:${{ github.sha }}

          docker push \
            $REGISTRY/student-api:${{ github.sha }}
