
spring:
  application:
    name: student-api

  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/postgres?sslmode=require
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
